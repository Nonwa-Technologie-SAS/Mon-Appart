name: mon-appart

services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: mon_appart
      POSTGRES_PASSWORD: mon_appart_dev
      POSTGRES_DB: mon_appart
    ports:
      # 5433 sur l'hôte : 5432 est souvent déjà pris par un PostgreSQL local.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mon_appart -d mon_appart"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # 6380 sur l'hôte : 6379 est souvent déjà pris par un Redis local.
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Interface SQL locale uniquement (127.0.0.1). Ne pas exposer hors de la machine.
  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      # Pas de domaine .local : pgAdmin le refuse (nom réservé).
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: mon_appart_dev
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
